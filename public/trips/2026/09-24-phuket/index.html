<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e7">
<title>普吉岛 2026 · 5天4晚旅行手册</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f2e7;color:#232522;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading-card{max-width:420px;background:#fffdf7;border:1px solid #ded9ca;border-radius:24px;padding:26px;box-shadow:0 14px 38px rgba(45,42,34,.08)}.loading b{display:block;font-size:20px;margin-bottom:6px}.loading span{font-size:13px;color:#77766e}
</style>
</head>
<body>
<div class="loading"><div class="loading-card"><b>正在打开普吉岛旅行手册…</b><span>加载行程、离线缓存与手绘总览地图</span></div></div>
<script>
(async()=>{
  const BASE='/trips/2026/09-24-phuket/base.html';
  const MAPDATA='/trips/2026/09-24-phuket/phuket-map-data.txt';
  const PAGE_CACHE='travel-atlas-phuket-v9';

  async function getText(url){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error(String(r.status));
      const text=await r.text();
      if('caches' in window){const c=await caches.open(PAGE_CACHE);await c.put(url,new Response(text,{headers:{'content-type':'text/plain;charset=utf-8'}}));}
      return text;
    }catch(e){
      if('caches' in window){const c=await caches.open(PAGE_CACHE),hit=await c.match(url);if(hit)return hit.text();}
      throw e;
    }
  }

  try{
    const [html,map64raw]=await Promise.all([getText(BASE),getText(MAPDATA)]);
    const doc=new DOMParser().parseFromString(html,'text/html');

    const style=doc.createElement('style');
    style.textContent=`
      .journey-overview{margin:0;display:grid;gap:12px}
      .journey-overview img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:#f8f4ec}
      .prep-groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .prep-group{padding:18px}
      .prep-group h3{margin:0 0 8px;font-size:17px}
      .prep-group ul{margin:0;padding:0;list-style:none}
      .prep-group li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
      .prep-group li:last-child{border-bottom:0}
      .prep-priority{display:inline-block;font-size:10px;font-weight:900;padding:3px 7px;border-radius:999px;background:var(--chip);color:var(--accent2);margin-left:5px}
      @media(max-width:680px){.prep-groups{grid-template-columns:1fr}}
    `;
    doc.head.appendChild(style);

    const map64clean=(map64raw||'').replace(/\s+/g,'');
    const map64=map64clean+'='.repeat((4-map64clean.length%4)%4);
    if(!map64.startsWith('/9j/'))throw new Error('invalid map jpeg data');

    const sections=[...doc.querySelectorAll('section')];
    const mapSec=sections.find(s=>s.querySelector('.section-title h2')?.textContent.includes('行程总览地图'));
    if(mapSec){
      const small=mapSec.querySelector('.section-title small');
      if(small)small.textContent='普吉主岛真实底图 · DAY1—DAY5 分色';
      const card=mapSec.querySelector('.map-card');
      if(card)card.innerHTML=`<figure class="journey-overview"><img src="data:image/jpeg;base64,${map64}" alt="普吉岛五天四晚手绘旅程总览地图，基于普吉岛主岛位置关系绘制，并按 DAY1 至 DAY5 分色标注机场、Kata、Karon、Patong、Phuket Old Town、Rawai 与 Promthep Cape 等主要行程节点"><figcaption class="map-note">基于普吉岛主岛真实位置关系重绘，并按 DAY1—DAY5 分色展示整体动线；海上 / 跳岛部分仍属于天气条件路线。</figcaption></figure>`;
    }

    const todoSec=sections.find(s=>s.querySelector('.section-title h2')?.textContent.includes('待办清单'));
    if(todoSec){
      todoSec.innerHTML=`
        <div class="section-title"><h2>出发前准备 & 待办</h2><small>旅行前按这份清单逐项核对</small></div>
        <div class="prep-groups">
          <article class="prep-group card"><h3>🛂 证件 / 入境</h3><ul>
            <li><b>护照原件</b><span class="prep-priority">最优先</span>：出门前最后再确认一次，并检查有效期。</li>
            <li><b>护照资料页备份：</b>手机离线保存一份电子版，另存到可信的云端位置。</li>
            <li><b>TDAC 数字入境卡：</b>抵达前按泰国官方要求完成，提交后把确认页 / QR 保存离线。</li>
            <li><b>机票与酒店订单：</b>CZ6063 / CZ6064、Metadee、Centara 的确认信息都离线保存。</li>
            <li><b>资金证明 / 泰铢现金：</b>准备适量泰铢和小额现金；最低携带要求出发前再核对泰国官方最新口径，不在手册里写死数字。</li>
            <li><b>旅行保险：</b>保单、保险公司联系方式和紧急联系人离线保存。</li>
          </ul></article>
          <article class="prep-group card"><h3>🔌 电子设备 / 网络</h3><ul>
            <li><b>手机充电器 + 数据线</b><span class="prep-priority">必带</span>。</li>
            <li><b>移动电源：</b>提前充满电，按航空公司规则随身携带，不放托运行李。</li>
            <li><b>万能转换插头：</b>泰国常见 220V / 50Hz，带一个旅行转换插头最省心。</li>
            <li><b>相机 / 运动相机：</b>如携带，确认电池、存储卡与对应充电器。</li>
            <li><b>网络：</b>提前确认国际漫游、eSIM 或当地 SIM；确保 Grab / Bolt 等打车 App 已登录可用。</li>
            <li><b>离线资料：</b>出发前至少打开一次本手册，让主要内容进入本地缓存。</li>
          </ul></article>
          <article class="prep-group card"><h3>🌧️ 雨季 / 海边用品</h3><ul>
            <li><b>折叠伞或轻便雨衣</b><span class="prep-priority">9 月建议</span>。</li>
            <li><b>防水袋 / 手机防水套：</b>海边、突然阵雨和 Day 2 海上方案都用得上。</li>
            <li><b>泳衣、拖鞋 / 凉鞋、快干衣物：</b>尽量轻便，湿了容易处理。</li>
            <li><b>防晒：</b>防晒用品、帽子、墨镜；阴天也别完全忽略。</li>
            <li><b>驱蚊用品：</b>尤其傍晚、绿植较多和户外用餐时。</li>
            <li><b>常用物品：</b>纸巾、湿巾、创可贴及个人日常必需品。</li>
          </ul></article>
          <article class="prep-group card"><h3>⏰ 出发前 24—48h</h3><ul>
            <li><b>航班：</b>再次确认 CZ6063 / CZ6064 状态、值机和行李额度。</li>
            <li><b>机场接送：</b>确认 9/24 HKT → Metadee、9/28 Centara → HKT。</li>
            <li><b>Day 2 海况：</b>看最新天气与正规运营方通知，决定跳岛还是南部海岸 B 方案。</li>
            <li><b>两家酒店：</b>再次确认入住 / 退房时间；Centara 两天早餐未包含。</li>
            <li><b>现金 / 卡：</b>泰铢、至少一张境外可用银行卡分开放置。</li>
            <li><b>最后五件：</b>护照、手机、钱包、充电器、移动电源，离家前逐项摸一遍。</li>
          </ul></article>
          <article class="prep-group card"><h3>🧭 行程待办</h3><ul>
            <li><b>Day 2 海上项目：</b>如预订，正式订单确定后再补集合点、时间和接送信息。</li>
            <li><b>Day 2 B 方案：</b>海况不佳就走 Karon Viewpoint → Nai Harn → Rawai → Promthep Cape。</li>
            <li><b>Day 3 行李：</b>从 Metadee 退房后一路带到 Centara，贵重物品随身。</li>
            <li><b>餐厅：</b>目前按区域留白，等后续补具体餐厅再锁定。</li>
            <li><b>地址：</b>页面里的酒店、机场、景点等地点可直接复制，方便粘贴到打车或地图 App。</li>
          </ul></article>
        </div>`;
    }

    document.open();
    document.write('<!doctype html>'+doc.documentElement.outerHTML);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div class="loading-card"><b>手册加载失败</b><span>请联网刷新一次；成功打开后会自动保留离线缓存。</span></div></div>';
  }
})();
</script>
</body>
</html>
