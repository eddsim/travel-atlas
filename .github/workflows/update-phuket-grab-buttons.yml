name: Update Phuket Grab buttons

on:
  push:
    paths:
      - '.github/workflows/update-phuket-grab-buttons.yml'
      - 'scripts/update-phuket-grab-buttons.mjs'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add Grab ride buttons
        run: node scripts/update-phuket-grab-buttons.mjs
      - name: Commit updated guide and standard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/trips/2026/09-24-phuket/index.html docs/TRAVEL_GUIDE_STANDARD.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Grab ride shortcuts to Phuket guide"
            git push
          fi
