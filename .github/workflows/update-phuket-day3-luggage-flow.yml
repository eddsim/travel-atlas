name: Update Phuket Day 3 luggage flow

on:
  push:
    paths:
      - '.github/workflows/update-phuket-day3-luggage-flow.yml'
      - 'scripts/update-phuket-day3-luggage-flow.mjs'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update itinerary HTML
        run: node scripts/update-phuket-day3-luggage-flow.mjs
      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/trips/2026/09-24-phuket/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Simplify Phuket Day 3 with Jungceylon luggage storage"
            git push
          fi
